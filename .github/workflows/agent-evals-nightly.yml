# .github/workflows/agent-evals-nightly.yml

name: agent-evals-nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Eval mode (cassette default; live_* needs judge secrets)
        type: choice
        options:
          - cassette
          - live_smoke
          - live_full
        default: cassette

concurrency:
  group: agent-evals-nightly
  cancel-in-progress: true

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install uv
        run: pipx install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Resolve eval mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=cassette" >> "$GITHUB_OUTPUT"
          fi

      - name: Cassette nightly evals
        if: steps.mode.outputs.value == 'cassette'
        run: uv run python scripts/run_agent_evals_nightly.py

      - name: Validate live judge secrets
        if: steps.mode.outputs.value == 'live_smoke' || steps.mode.outputs.value == 'live_full'
        shell: bash
        run: |
          missing=0
          for key in PALATIUM_EVAL_JUDGE_PROVIDER PALATIUM_EVAL_AGENT_PROVIDER; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub secret $key for live judge mode"
              missing=1
            fi
          done
          if [ -z "${OPENAI_API_KEY:-}" ] && [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::At least one of OPENAI_API_KEY or ANTHROPIC_API_KEY is required"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
        env:
          PALATIUM_EVAL_JUDGE_PROVIDER: ${{ secrets.PALATIUM_EVAL_JUDGE_PROVIDER }}
          PALATIUM_EVAL_AGENT_PROVIDER: ${{ secrets.PALATIUM_EVAL_AGENT_PROVIDER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Live judge smoke
        if: steps.mode.outputs.value == 'live_smoke' || steps.mode.outputs.value == 'live_full'
        env:
          PALATIUM_EVAL_LIVE_JUDGE: "1"
          PALATIUM_EVAL_JUDGE_PROVIDER: ${{ secrets.PALATIUM_EVAL_JUDGE_PROVIDER }}
          PALATIUM_EVAL_JUDGE_MODEL: ${{ secrets.PALATIUM_EVAL_JUDGE_MODEL }}
          PALATIUM_EVAL_AGENT_PROVIDER: ${{ secrets.PALATIUM_EVAL_AGENT_PROVIDER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python scripts/run_agent_evals_judge_smoke.py

      - name: Live full nightly evals
        if: steps.mode.outputs.value == 'live_full'
        env:
          PALATIUM_EVAL_LIVE_JUDGE: "1"
          PALATIUM_EVAL_JUDGE_PROVIDER: ${{ secrets.PALATIUM_EVAL_JUDGE_PROVIDER }}
          PALATIUM_EVAL_JUDGE_MODEL: ${{ secrets.PALATIUM_EVAL_JUDGE_MODEL }}
          PALATIUM_EVAL_AGENT_PROVIDER: ${{ secrets.PALATIUM_EVAL_AGENT_PROVIDER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python scripts/run_agent_evals_nightly.py --live-judge

      - name: Upload nightly eval report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-evals-nightly-${{ steps.mode.outputs.value }}
          path: artifacts/agent_evals_nightly.json
          if-no-files-found: ignore
