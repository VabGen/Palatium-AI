# .github/dependabot.yml
# Supply-chain hygiene: keep Python, Actions and web deps patched automatically.
# Security updates are opened regardless of schedule whenever an advisory lands.

version: 2
updates:
  # `uv`, не `pip`: pip-экосистема правит только pyproject.toml, а гейт
  # `uv sync --frozen` / `uv lock --check` (025) требует синхронный uv.lock.
  # С pip все Python-PR приезжают красными ещё до ревью версий.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Batch routine bumps into one PR so security alerts stay visible.
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # Observability overlay + Dockerfiles: keep image tags patched (deploy/observability).
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
