# Local quality gates that mirror `scripts/ci_quality.py` (rules 000 / 050 / 075).
#
# Install once:  uv run pre-commit install
# Run on all files: uv run pre-commit run --all-files
#
# Scope note: this file mirrors *fast* CI gates only. The full pytest suite +
# coverage floors stay in CI (`ci_quality.py`) because they are too slow for a
# commit hook. Secret scanning stays in CI too — the gitleaks job runs with
# `fetch-depth: 0` so it scans every commit of the PR; a pre-commit hook would
# only see the staged diff and would give false confidence (050).
minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit, pre-push]
fail_fast: false

# Rule 090: `mcp_servers/edms/JavaEdms/` is a read-only reference (someone else's
# code) — no hook may rewrite a byte of it.
exclude: ^mcp_servers/edms/JavaEdms/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-case-conflict
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
        exclude: ^(\.cursor/|web/src/)
      - id: trailing-whitespace
        exclude: ^(\.cursor/|web/src/)|\.md$
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        name: ruff check (includes S/security selectors)
        args: ["--fix", "--exit-non-zero-on-fix", "--force-exclude"]
      - id: ruff-format
        args: ["--force-exclude"]

  - repo: local
    hooks:
      # Entries go through uv: `python` is not on PATH on a stock Windows box, and a bare
      # `mypy`/`basedpyright` would not be the one pinned in the lock (025).
      - id: check-debt-markers
        name: debt markers (086)
        entry: uv run --no-project python scripts/check_todos.py
        language: system
        pass_filenames: false

      - id: check-import-layers
        name: import layers (000-architecture)
        entry: uv run --no-project python scripts/check_import_layers.py
        language: system
        pass_filenames: false
        files: ^src/palatium_ai/.*\.py$

      - id: lint-observability
        name: lint observability (no raw query in logs/metrics/OTel)
        entry: uv run --no-project python scripts/lint_observability.py
        language: system
        pass_filenames: false
        files: ^src/palatium_ai/.*\.py$

      - id: mypy-strict
        name: mypy --strict (src/palatium_ai)
        entry: uv run mypy --strict src/palatium_ai
        language: system
        pass_filenames: false
        files: \.py$
        stages: [pre-push]

      # ── Basedpyright ─────────────────────────────────────────────────────────
      # Not a project dependency (pyproject: ruff + mypy are the gates); install it into the
      # same env with `uv add --dev basedpyright` or run it from a global install — either
      # way the entry below resolves it through uv, not from PATH.
      # Ловит ошибки, которые mypy пропускает (Protocol ellipsis, redis overloads,
      # awaitable mismatches). ~30-60s, поэтому pre-push (как mypy), не на каждый коммит.
      - id: basedpyright
        name: basedpyright (IDE parity, pre-push)
        entry: uv run basedpyright --project .
        language: system
        pass_filenames: false
        files: \.py$
        stages: [pre-push]



# Проверить весь проект
# basedpyright --project .

# Только src/ (быстрее)
# basedpyright src/palatium_ai

# Конкретный файл
# basedpyright src/palatium_ai/core/observability/cost_tracker.py

# С JSON-выводом (для скриптов)
# basedpyright --outputjson src/palatium_ai > errors.json

# Только pre-commit hooks (быстрые: ruff + debt markers)
# uv run pre-commit run --all-files

# Все hooks включая pre-push (mypy + basedpyright)
# uv run pre-commit run --all-files --hook-stage pre-push
