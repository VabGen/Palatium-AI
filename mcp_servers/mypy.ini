# =============================================================================
# mypy config для mcp_servers/
# =============================================================================

[mypy]
python_version = 3.14
strict = True

mypy_path = $MYPY_CONFIG_FILE_DIR/..

explicit_package_bases = True
ignore_missing_imports = True
plugins = pydantic.mypy

# ===================================================================================================

# === === === === === === === === === === === === === === === === === === === === === === === === ===
# === Основной проект - poetry run mypy .                                                      ~~ ===
# === mcp_servers отдельно - poetry run mypy --config-file mcp_servers/mypy.ini mcp_servers    ~~ ===
# === Через скрипт - .\scripts\type-check.ps1                                                  ~~ ===
# === === === === === === === === === === === === === === === === === === === === === === === === ===

