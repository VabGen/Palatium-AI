# =============================================================================
# mypy config для mcp_servers/
# =============================================================================

[mypy]
python_version = 3.14
strict = True

mypy_path = $MYPY_CONFIG_FILE_DIR/..

explicit_package_bases = True
ignore_missing_imports = True
plugins = pydantic.mypy
# Legacy EDMS assistant + JavaEdms are reference-only (090/017). Tox/type-check
# pass stub paths explicitly so mypy never walks those trees; exclude is a belt.
exclude = (?x)(edms-ai-assistant|JavaEdms)

# ===================================================================================================

# === === === === === === === === === === === === === === === === === === === === === === === === ===
# === Основной проект - poetry run mypy .                                                      ~~ ===
# === mcp stubs - poetry run mypy --config-file mcp_servers/mypy.ini mcp_servers/analytics …  ~~ ===
# === Через скрипт - .\scripts\type-check.ps1                                                  ~~ ===
# Legacy edms-ai-assistant / JavaEdms — не в scope (090/017); пути задаются явно в tox/type-check.
# === === === === === === === === === === === === === === === === === === === === === === === === ===

# ===================================================================================================