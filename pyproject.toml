    "lxml (>=6.1.3,<7.0.0)",
    "minio (>=7.2.0,<8.0.0)",
    "pillow (>=11.0.0,<12.0.0)",
    "pycryptodome (>=3.23.0,<4.0.0)",
    "pymupdf (>=1.24.0,<2.0.0)",
    "pypdf (>=6.0.0,<7.0.0)",
