[project]
name = "palatium-ai"
version = "0.1.0"
description = "Intellectual office assistant"
authors = [{ name = "VabGen", email = "VabGen@gmail.com" }]
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = "MIT"
keywords = ["ai", "edms", "automation", "assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "alembic (>=1.19.1,<2.0.0)",
    "asyncpg (>=0.30.0,<0.40.0)",
    "cryptography (>=50.0.0,<51.0.0)",
    "fastapi (>=0.140.0,<0.150.0)",
    "fastmcp (==4.1.0)",
    "fpdf2 (>=2.8.8,<3.0.0)",
    "httpx (>=0.28.0,<0.29.0)",
    "json-repair (>=0.63.4,<0.64.0)",
    "jsonschema (>=4.25.0,<5.0.0)",
    "langchain-core (>=1.6.4,<2.0.0)",
    "langfuse (>=3.0.0,<4.0.0)",
    "langgraph (>=1.2.10,<2.0.0)",
    "langgraph-checkpoint-postgres (>=2.0.0,<4.0.0)",
    "litellm (>=1.97.0,<2.0.0)",
    # Default host backends: ATTACHMENTS_BLOB_BACKEND=minio, GRAPH_QUERY_BACKEND=neo4j.
    # Core so plain `uv sync --frozen` boots without --extra (050).
    "minio (>=7.2.0,<8.0.0)",
    "neo4j (>=5.28.0,<6.0.0)",
    "openai (>=2.20.0,<3.0.0)",
    "opentelemetry-api (>=1.29.0,<2.0.0)",
    "opentelemetry-exporter-otlp-proto-http (>=1.29.0,<2.0.0)",
    "opentelemetry-sdk (>=1.29.0,<2.0.0)",
    "pgvector (>=0.3.6,<0.4.0)",
    "prometheus-client (>=0.21.0,<1.0.0)",
    "psycopg[binary,pool] (>=3.2.0,<4.0.0)",
    "py-consul (>=1.7.1,<2.0.0)",
    "pydantic (>=2.13.0,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "pyjwt (>=2.9.0,<3.0.0)",
    "redis (>=8.0.0,<9.0.0)",
    "sqlalchemy[asyncio] (>=2.0.50,<3.0.0)",
    "starlette (>=1.7.0,<2.0.0)",
    "structlog (>=26.1.0,<27.0.0)",
    "tenacity (>=9.0.0,<10.0.0)",
    "uvicorn[standard] (>=0.50.0,<0.60.0)",
]
license-files = ["LICENSE"]

[project.optional-dependencies]
mysql = ["mysqlclient (>=2.2.0,<3.0.0)"]
pgsql = ["psycopg2 (>=2.9,<3.0)"]
graphiti = ["graphiti-core (>=0.11.0,<1.0.0)"]
# Parsing/OCR for attachments (minio is a core dep — blob backend).
attachments = [
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "lxml (>=6.1.3,<7.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "pycryptodome (>=3.23.0,<4.0.0)",
    "pymupdf (>=1.24.0,<2.0.0)",
    "pypdf (>=6.0.0,<7.0.0)",
    "pytesseract (>=0.3.13,<1.0.0)",
    "python-docx (>=1.1.0,<2.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
]

[project.urls]
homepage = "https://github.com/your-org/palatium-ai"
repository = "https://github.com/your-org/palatium-ai"
documentation = "https://github.com/your-org/palatium-ai/docs/"
"Bug Tracker" = "https://github.com/your-org/palatium-ai/issues"

[dependency-groups]
test = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.0.0,<2.0.0)",
    "pytest-cov (>=6.0.0,<9.0.0)",
    "pyyaml (>=6.0.0,<7.0.0)",
]
lint = ["ruff (>=0.16.0,<0.17.0)"]
type-check = [
    "mypy (>=2.0.0,<3.0.0)",
    "types-PyYAML (>=6.0.0,<7.0.0)",
    "types-requests (>=2.32.0,<3.0.0)",
]
security = ["pip-audit (>=2.7.0,<4.0.0)"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "type-check" },
    { include-group = "security" },
    "tox (>=4.20.0,<4.60.0)",
    "tox-uv (>=1.10.0,<2.0.0)",
    "pre-commit (>=3.5.0,<5.0.0)",
]

[tool.uv]
default-groups = ["dev"]
package = true
python-preference = "managed"
#link-mode = "copy"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

# ── Ruff ────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 130
target-version = "py314"
exclude = ["mcp_servers/edms/edms-ai-assistant"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "C90",
    "I", "UP", "B", "SIM", "S",
    "D", "N", "TC", "DTZ", "T20", "BLE", "ASYNC",
    "PT", "RUF", "RET", "PIE", "FURB", "PERF", "ERA", "PTH", "TID",
]
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D107",
    "D203", "D211", "D212", "D213", "D401",
    "TC001", "TC003",
    "PTH123",
]
fixable = ["ALL"]

allowed-confusables = [
    "А", "В", "Е", "К", "М", "Н", "О", "Р", "С", "Т", "У", "Х",
    "а", "е", "о", "р", "с", "у", "х",
    "б", "г", "З", "і", "–", "×",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = true
mark-parentheses = true
parametrize-names-type = "csv"
parametrize-values-type = "tuple"
raises-require-match-for = ["ValueError", "RuntimeError", "ValidationError"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101", "S105", "S106", "D", "E501", "TC001", "DTZ",
    "PT011", "RUF012",
]
"alembic/**/*.py" = ["S608", "E501"]
"mcp_servers/**/*.py" = ["C901"]
"scripts/**/*.py" = ["C901", "T20", "BLE", "PTH"]
".cursor/hooks/**/*.py" = ["T20", "BLE"]
"src/palatium_ai/application/**/*.py" = ["BLE"]
"src/palatium_ai/infrastructure/**/*.py" = ["BLE"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true
lines-between-types = 1

# ── mypy ────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
show_error_codes = true
show_column_numbers = true
exclude = ["tests/", "build/", "dist/", ".venv/", "mcp_servers/"]
mypy_path = ["src"]
explicit_package_bases = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ── Pyright / basedpyright ──────────────────────────────────────────────────────
[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
extraPaths = ["src", ".cursor/hooks"]
include = ["src", "scripts"]
exclude = ["**/node_modules", "**/__pycache__", ".venv", "mcp_servers", "tests"]
typeCheckingMode = "standard"

# ── pytest ──────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pkg_resources",
    "ignore:^.*litellm.*:DeprecationWarning",
    "ignore::DeprecationWarning:neo4j.*",
    "ignore:.*asyncio\\.(get|set)_event_loop_policy.*:DeprecationWarning",
    "ignore:.*asyncio\\.(AbstractEventLoopPolicy|WindowsSelectorEventLoopPolicy|DefaultEventLoopPolicy).*:DeprecationWarning",
]
markers = [
    "live: hits a real LLM / network; opt-in via PALATIUM_LIVE_EVAL=1",
    "live_formatter: Formatter json_schema smoke; run with pytest -m live_formatter",
    "llm_live: live llm_judge evals; opt-in via PALATIUM_EVAL_LIVE_JUDGE=1",
    "integration: graph/service integration tests (fake LLM; no DATABASE_URL required)",
    "slow: load/latency/scaling regression tests; excluded from PR CI (080, 075)",
]
log_cli = false
log_cli_level = "INFO"

# ── Coverage ────────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["palatium_ai"]
branch = true
omit = [
    "*/migrations/*",
    "*/alembic/*",
]

[tool.coverage.paths]
source = ["src/", "*/site-packages/"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    '^\s*\.\.\.\s*$',
]

# ===================================================================================================================

# === === === === === === === === === === === === === === === === === === === === === === === === === === === === ===
# === Линтинг и проверка форматирования - uv run ruff check .                                                  ~~ ===
# === Автоисправление линтинга - uv run ruff check --fix .                                                     ~~ ===
# === Форматирование кода - uv run ruff format .                                                               ~~ ===
# === Проверка типов - uv run mypy .                                                                           ~~ ===
# === Запуск тестов - uv run pytest . || uv run pytest --cov=palatium_ai --cov-report=term-missing             ~~ ===
# === uv.lock & uv sync (устанавливает основные и dev-зависимости)                                             ~~ ===
# === === === === === === === === === === === === === === === === === === === === === === === === === === === === ===

# === === === === === === === === === === === === === === === === === === === === === === === === === === === === ===
# === Установка Python - uv python install 3.14 --default                                                      ~~ ===
# === Создать виртуальное окружение с Python 3.14 - uv venv --python 3.14                                      ~~ ===
# === Синхронизация окружения (установит основные и dev-зависимости) - uv sync                                 ~~ ===
# === Parsing/OCR for attachments (minio is core) - uv sync --extra attachments / uv sync --frozen --extra     ~~ ===
# === Обновит uv.lock до последних совместимых версий - uv lock --upgrade || uv lock --upgrade-package httpx   ~~ ===
# === Сборка пакета: Создаст source и wheel дистрибутивы в папке dist/. - uv build                             ~~ ===
# === Очистка кеша - uv cache clean                                                                            ~~ ===
# === Дерево зависимостей - uv tree                                                                            ~~ ===
# === Разово для текущей сессии (PowerShell) - $env:UV_LINK_MODE = "copy"                                      ~~ ===
# === Навсегда (PowerShell) - [Environment]::SetEnvironmentVariable("UV_LINK_MODE", "copy", "User")            ~~ ===
# === === === === === === === === === === === === === === === === === === === === === === === === === === === === ===

# ===================================================================================================================

# ================ Tesseract OCR installation =======================================================================
# choco install tesseract -y
# Проверь текущий PATH
#   $env:PATH

# Добавь путь к Tesseract (временно для текущей сессии)
#   $env:PATH += ";C:\Program Files\Tesseract-OCR"
# $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

# Добавляет в User PATH
#   [Environment]::SetEnvironmentVariable("Path", $env:PATH + ";C:\Program Files\Tesseract-OCR", "User")

# Скачать русскую модель (~44 MB)
# Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata/raw/main/rus.traineddata" `
#    -OutFile "C:\Program Files\Tesseract-OCR\tessdata\rus.traineddata"

# Проверить что файл скачался
# Test-Path "C:\Program Files\Tesseract-OCR\tessdata\rus.traineddata"

# Список доступных языков
# tesseract --list-langs
# ===================================================================================================================
