    "tox (>=4.20.0,<4.60.0)",
    "pre-commit (>=3.5.0,<5.0.0)",
]
graph = ["neo4j (>=5.28.0,<6.0.0)"]
attachments = [
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "lxml (>=6.1.3,<7.0.0)",
    "minio (>=7.2.0,<8.0.0)",
    "pillow (>=11.0.0,<12.0.0)",
    "pycryptodome (>=3.23.0,<4.0.0)",
    "pymupdf (>=1.24.0,<2.0.0)",
    "pypdf (>=6.0.0,<7.0.0)",
    "pytesseract (>=0.3.13,<1.0.0)",
    "python-docx (>=1.1.0,<2.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
]

[tool.poetry]
packages = [{ include = "palatium_ai", from = "src" }]

[project.urls]
homepage = "https://github.com/your-org/palatium-ai"
repository = "https://github.com/your-org/palatium-ai"
documentation = "https://github.com/your-org/palatium-ai/docs/"
"Bug Tracker" = "https://github.com/your-org/palatium-ai/issues"

[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# ── Ruff ────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py314"
# `mcp_servers/edms/edms-ai-assistant/` — чужой legacy-код СЭД, который разбирается как
# референс для адаптера (092), а не поддерживается нами. Находки в нём (56 на момент
# разбора) не его проблема и не наша: они тонут в шуме и прячут находки в нашем коде.
# По 017/050 такой путь исключается в конфиге тула, а не редактируется. mypy/pyright
# уже пропускают `mcp_servers` целиком; ruff — точечно, чтобы наши stub-серверы
# (`edms_mcp_server.py`, `contract.py`) остались под линтером.
exclude = ["mcp_servers/edms/edms-ai-assistant"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "C90",
    "I", "UP", "B", "SIM", "S",
    "D", "N", "TC", "DTZ", "T20", "BLE", "ASYNC",
    "PT", "RUF", "RET", "PIE", "FURB", "PERF", "ERA", "PTH", "TID",
]
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D107",
    "D203", "D211", "D212", "D213", "D401",
    "TC001", "TC003",
    "PTH123",
]
fixable = ["ALL"]

allowed-confusables = [
    "А", "В", "Е", "К", "М", "Н", "О", "Р", "С", "Т", "У", "Х",
    "а", "е", "о", "р", "с", "у", "х",
    "б", "г", "З", "і", "–", "×",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = true
mark-parentheses = true
parametrize-names-type = "csv"
parametrize-values-type = "tuple"
raises-require-match-for = ["ValueError", "RuntimeError", "ValidationError"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101", "S105", "S106", "D", "E501", "TC001", "DTZ",
    "PT011", "RUF012",
]
"alembic/**/*.py" = ["S608", "E501"]
"mcp_servers/**/*.py" = ["C901"]
"scripts/**/*.py" = ["C901", "T20", "BLE", "PTH"]
".cursor/hooks/**/*.py" = ["T20", "BLE"]
# Граничный broad-catch — легитимный приём (035) при явной причине на сайте, но не «на весь
# слой»: пока перечислено 42 сайта `except Exception` в адаптерах, и отключённый целиком
# `BLE` их не различает. Исключение без TODO — ошибка ревью (015), поэтому долг записан
# явно; долг закрывается переносом причины на сам сайт (`# noqa: BLE001  # boundary catch: …`)
# и удалением этих двух строк.
# TODO(hardening после W6, plans/cursor-rules-hardening §5, 2026-09-30): сузить BLE001 по сайтам.
"src/palatium_ai/application/**/*.py" = ["BLE"]
"src/palatium_ai/infrastructure/**/*.py" = ["BLE"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true
lines-between-types = 1

# ── mypy ────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
show_error_codes = true
show_column_numbers = true
exclude = ["tests/", "build/", "dist/", ".venv/", "mcp_servers/"]
mypy_path = ["src"]
explicit_package_bases = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ── Pyright ─────────────────────────────────────────────────────────────────────
[tool.pyright]
pythonVersion = "3.14"
extraPaths = ["src", ".cursor/hooks"]
include = ["src", "tests", "scripts"]
exclude = ["**/node_modules", "**/__pycache__", ".venv", "mcp_servers"]
typeCheckingMode = "standard"

# ── pytest ──────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pkg_resources",
    "ignore:^.*litellm.*:DeprecationWarning",
    "ignore::DeprecationWarning:neo4j.*",
    # Python 3.14 → 3.16: asyncio event-loop policies. pytest-asyncio≥1 avoids
    # most of these; keep ignores for residual third-party / Windows policy pin.
    "ignore:.*asyncio\\.(get|set)_event_loop_policy.*:DeprecationWarning",
    "ignore:.*asyncio\\.(AbstractEventLoopPolicy|WindowsSelectorEventLoopPolicy|DefaultEventLoopPolicy).*:DeprecationWarning",
]
markers = [
    "live: hits a real LLM / network; opt-in via PALATIUM_LIVE_EVAL=1",
    "llm_live: live llm_judge evals; opt-in via PALATIUM_EVAL_LIVE_JUDGE=1",
    "integration: graph/service integration tests (fake LLM; no DATABASE_URL required)",
    "slow: load/latency/scaling regression tests; excluded from PR CI (080, 075)",
]
log_cli = false
log_cli_level = "INFO"

# ── Coverage ────────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["palatium_ai"]
branch = true
omit = [
    "*/migrations/*",
    "*/alembic/*",
]

[tool.coverage.paths]
source = ["src/", "*/site-packages/"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    '^\s*\.\.\.\s*$',
]

