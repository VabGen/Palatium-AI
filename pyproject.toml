    "cryptography (>=50.0.0,<51.0.0)",
    "fastapi (>=0.140.0,<0.150.0)",
    "fastmcp (==4.0.0)",
    "fpdf2 (>=2.8.8,<3.0.0)",
    "httpx (>=0.28.0,<0.29.0)",
    "json-repair (>=0.63.4,<0.64.0)",
    "jsonschema (>=4.25.0,<5.0.0)",
    "langchain-core (>=1.6.4,<2.0.0)",
    "langfuse (>=3.0.0,<4.0.0)",
    "langgraph (>=1.2.10,<2.0.0)",
    "langgraph-checkpoint-postgres (>=2.0.0,<4.0.0)",
    "litellm (>=1.97.0,<2.0.0)",
    "openai (>=2.20.0,<3.0.0)",
    "opentelemetry-api (>=1.29.0,<2.0.0)",
    "opentelemetry-exporter-otlp-proto-http (>=1.29.0,<2.0.0)",
    "opentelemetry-sdk (>=1.29.0,<2.0.0)",
    "pgvector (>=0.3.6,<0.4.0)",
    "prometheus-client (>=0.21.0,<1.0.0)",
    "psycopg[binary,pool] (>=3.2.0,<4.0.0)",
    "py-consul (>=1.7.1,<2.0.0)",
    "pydantic (>=2.13.0,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "pyjwt (>=2.9.0,<3.0.0)",
    "redis (>=8.0.0,<9.0.0)",
    "sqlalchemy[asyncio] (>=2.0.50,<3.0.0)",
    "starlette (>=1.7.0,<2.0.0)",
    "structlog (>=26.1.0,<27.0.0)",
    "tenacity (>=9.0.0,<10.0.0)",
