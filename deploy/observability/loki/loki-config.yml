# Loki single-binary config (P1-7). Local dev / single-node only.
#
# Retention is bounded on purpose: unbounded log retention is how a stack quietly
# fills a disk. Audit records live in the hash-chained audit log, NOT here (§ 040).

auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  # Single ingester with an in-memory ring. At boot the rate store polls the ring
  # before this process has registered itself, so exactly one
  # `ratestore.go ... "error getting ingester clients" err="empty ring"` line is
  # logged per start — and a `DeadlineExceeded` against an ingester address when a
  # stale entry is still being resolved. Both are benign and are NOT a symptom of a
  # broken ring: readiness flips to `ready`, `/ring` shows the ingester ACTIVE, and
  # a push followed by `query_range` returns the line (verified on the pinned 3.3.2).
  # Do not "fix" this by pinning `common.instance_addr` — that only swaps the
  # advertised address (container IP → loopback) and does not remove the log line.
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h
  # Guard against a single noisy pod; structlog JSON lines are small.
  max_query_series: 500
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules

analytics:
  reporting_enabled: false
