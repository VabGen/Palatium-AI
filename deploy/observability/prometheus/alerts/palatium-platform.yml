# Security / platform-integrity alerts (020, 040).
#
# These are not SLO burn alerts — they are control failures. Several are
# page-worthy even at a single occurrence because they indicate an active
# attempt or a broken compliance control.

groups:
  - name: palatium-security
    interval: 30s
    rules:
      # Audit chain is a compliance control (§ 040). A single write failure means
      # the hash chain may have a gap — never tolerate it.
      - alert: PalatiumAuditChainWriteFailure
        expr: increase(palatium_audit_write_failures_total[10m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Audit chain write failed"
          description: "palatium_audit_write_failures_total increased — the hash chain may be broken. Verify the daily chain check and investigate storage."

      # Replay of an HITL card is a security signal: someone is reusing a card_id.
      - alert: PalatiumHitlCardReplayRejected
        expr: increase(palatium_hitl_card_replay_rejected_total[10m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "HITL card replay attempt rejected"
          description: "A repeated answer to an already-consumed card_id was rejected (020: card is single-use). Audit event raised."

      - alert: PalatiumRbacDenialSpike
        expr: sum(rate(palatium_rbac_denied_total[5m])) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "RBAC tool denials above baseline"
          description: "Sustained denials > 0.2/s over 10m. Either a misconfigured agent allow-list or an attempt to call tools outside scope."

      - alert: PalatiumHitlDenySpike
        expr: sum(rate(palatium_hitl_deny_total[15m])) > 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "HITL denials above baseline"
          description: "Break down by reason (forge/conflict/expired/forbidden) — a spike in `expired` means cards are timing out before users act."

  - name: palatium-platform
    interval: 30s
    rules:
      - alert: PalatiumTurnHopBudgetExceeded
        expr: increase(palatium_turn_hop_budget_exceeded_total[15m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Turns exceeding the hop latency budget"
          description: "More than 5 turns breached TURN_HOP_BUDGET_MS in 15m. Inspect per-node latency (palatium:agent_request_p95_seconds:5m)."

      - alert: PalatiumHumanEscalationRate
        expr: sum by (reason) (rate(palatium_agent_human_escalation_total[15m])) > 0.1
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "Elevated human escalation rate ({{ $labels.reason }})"
          description: "Escalations for reason {{ $labels.reason }} are above 0.1/s over 15m. Informational — a sustained rise usually tracks a confidence-threshold regression."

      # Budget guard. Tune the threshold to DAILY_COST_BUDGET_USD so this fires
      # before the app-level cap starts rejecting turns.
      - alert: PalatiumLlmCostBurnHigh
        expr: palatium:llm_cost_usd_per_hour:1h > 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "LLM spend above $1/hour"
          description: "Observed ${{ $value | printf \"%.2f\" }}/h. Compare with DAILY_COST_BUDGET_USD and per-turn TURN_COST_BUDGET_USD."

      # Context dumping would show up as runaway delivered tokens (065).
      - alert: PalatiumContextTokensHigh
        expr: sum(rate(palatium_context_tokens_used[15m])) > 20000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Context token delivery rate is high"
          description: ">20k tokens/s delivered to agents over 15m. Check ContextBuilder budgets — a probe for JIT/compact regressions (065)."

      - alert: PalatiumMemoryEntryOversized
        expr: histogram_quantile(0.95, sum(rate(palatium_memory_entry_size_bytes_bucket[15m])) by (le)) > 16384
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "Memory entries above 16 KiB at p95"
          description: "Oversized memory entries inflate recall cost and hurt precision (060). Inspect p95/p99 rather than the mean."

      - alert: PalatiumMemoryExtractDeadLetter
        expr: palatium_memory_extract_dead_letter_total > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Memory extract jobs in dead-letter"
          description: "Durable extract queue has dead jobs (M3/M7). Inspect SKIP LOCKED workers and DLQ reclaim."

      - alert: PalatiumMemoryPromoteErrors
        expr: sum(rate(palatium_memory_promote_errors_total[15m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Memory promote batch errors"
          description: "medium→graph promote is failing (060/M7). Check Neo4j GraphWritePort and jobs.memory_promote."

      # Not an error: the batch correctly refused to flip a PII fact without a human.
      # Non-zero means facts are stuck in "candidate" until the HITL channel ships (M5 F3).
      # info, not warning — nothing is broken, something is waiting for a decision.
      - alert: PalatiumMemoryPromoteBlockedPii
        expr: increase(palatium_memory_promote_blocked_pii_total[1h]) > 0
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "PII fact supersede withheld pending human approval"
          description: "Promote candidates are held back because the flip would change a PII fact (M5 F3). Count is re-incremented every batch until resolved — treat the series as 'stuck facts', not 'events'."

  - name: palatium-adaptive-grounding
    interval: 30s
    rules:
      # Near-full ON cohort still taking Adaptive-OFF stub → mixed pod config / stale env.
      - alert: PalatiumGroundingFlagNotPropagated
        expr: |
          (
            sum(rate(palatium_grounding_rollout_total{enabled="true"}[15m]))
            /
            clamp_min(sum(rate(palatium_grounding_rollout_total[15m])), 1e-9)
          ) > 0.9
          and
          sum(rate(palatium_grounding_flag_off_total[15m])) > 0.01
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Adaptive Grounding ON cohort still hits flag_off stub"
          description: >-
            >90% sticky-enabled decisions but flag_off still increments — some pods
            likely still on Adaptive OFF. Check panel 1.1/1.2 and pod env. PCT=0
            zero-traffic case is Loki canary enabled_but_zero_rollout, not this alert.

      - alert: PalatiumGroundingDegradedRatioHigh
        expr: |
          (
            sum(rate(palatium_grounding_degraded_total{mode="optional"}[30m]))
            /
            clamp_min(
              sum(rate(palatium_grounding_degraded_total{mode="optional"}[30m]))
              + sum(rate(palatium_grounding_satisfied_total{mode="optional"}[30m])),
              1e-9
            )
          ) > 0.7
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Optional grounding degraded ratio >70%"
          description: "Most optional retrievals degrade to parametric LLM — corpus empty. Pause PCT rollout."

      - alert: PalatiumGroundingRequiredEmptyHigh
        expr: |
          (
            sum(rate(palatium_grounding_required_empty_total[30m]))
            /
            clamp_min(sum(rate(palatium_grounding_mode_total{mode="required"}[30m])), 1e-9)
          ) > 0.30
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Required-empty ratio >30%"
          description: "Clarification template is a hot path. Pause and review classifier/template."

      - alert: PalatiumGroundingHallucinationDetected
        expr: increase(palatium_grounding_hallucination_total[1h]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Grounding hallucination sample detected"
          description: "Sampled judge marked a degraded answer as hallucinated. Rollback PCT; review ungrounded answers."

      - alert: PalatiumGroundingHallucinationRate
        expr: |
          (
            sum(rate(palatium_grounding_hallucination_total[1h]))
            /
            clamp_min(sum(rate(palatium_grounding_judge_runs_total[1h])), 1e-9)
          ) > 0.05
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Grounding hallucination sample rate >5%"
          description: "Sustained judge-positive rate above rollback trigger. Prefer 1h window (sample=1% is sparse)."

      - alert: PalatiumGroundingJudgeSilent
        expr: |
          sum(increase(palatium_grounding_judge_runs_total[1h])) == 0
          and
          sum(increase(palatium_grounding_degraded_total[1h])) > 100
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Grounding LLM-judge is silent under load"
          description: ">100 degraded turns in 1h but zero judge runs — sample task not firing or stuck."

      - alert: PalatiumGroundingJudgeFailures
        expr: sum(rate(palatium_grounding_judge_failed_total[15m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Grounding LLM-judge failing"
          description: "Quality metric unreliable while judge errors. Check grounding.judge_failed logs."

      - alert: PalatiumGroundingLatencyRegression
        expr: |
          (
            histogram_quantile(0.95, sum by (le) (
              rate(palatium_grounding_latency_seconds_bucket{degraded="true"}[15m])
            ))
            /
            clamp_min(
              histogram_quantile(0.95, sum by (le) (
                rate(palatium_grounding_latency_seconds_bucket{degraded="false"}[15m])
              )),
              0.001
            )
          ) > 2.0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Grounding empty-path p95 >2× grounded"
          description: >-
            Proxy for ON/OFF latency gate. Sparse until satisfied path records
            degraded=false latency — treat NaN as no data, not green.