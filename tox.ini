[tox]
envlist = lint,type,test
; skipsdist = true

[testenv]
package = editable
setenv =
    PYTHONPATH = {toxinidir}/src

[testenv:lint]
deps = ruff >=0.16.0,<0.17.0
commands = ruff check .

# ===================================================================================================
# TYPE — обе проверки mypy: main + mcp stubs (не legacy edms-ai-assistant / JavaEdms)
# ===================================================================================================
[testenv:type]
deps =
    mypy >=2.0.0,<3.0.0
    types-requests >=2.32.0,<3.0.0
    types-PyYAML >=6.0.0,<7.0.0
    types-toml >=0.10.0,<0.11.0
changedir = {toxinidir}
commands =
    mypy .
    mypy --config-file mcp_servers/mypy.ini mcp_servers/__init__.py mcp_servers/mcp_stub_auth.py mcp_servers/mcp_stub_hardening.py mcp_servers/mcp_stub_runtime.py mcp_servers/mcp_stub_tools.py mcp_servers/analytics mcp_servers/gateway mcp_servers/platform mcp_servers/edms/__init__.py mcp_servers/edms/edms_mcp_server.py

[testenv:test]
# Keep pins aligned with pyproject.toml (Python 3.14: pytest-asyncio<1 imports
# deprecated asyncio.*EventLoopPolicy and fails under filterwarnings=error).
deps =
    pytest >=9.0.3,<10.0.0
    pytest-cov >=6.0.0,<9.0.0
    pytest-asyncio >=1.0.0,<2.0.0
commands =
    # Match CI PR path (scripts/ci_quality.py): live/llm_live/slow are opt-in (075/080).
    pytest --cov=palatium_ai --cov-report=term-missing -m "not live and not llm_live and not slow"
# allowlist_externals = poetry

[testenv:web]
skip_install = true
changedir = web
allowlist_externals = npm, npx
commands =
    npm install --no-save prettier eslint
    npx prettier --write .
    ; npx eslint --fix .

# ===================================================================================================================

# === === === === === === === === === === === === === === === === === ===  === ===  Remove-Item -Recurse -Force .\.tox
# === Запуск всех проверок - poetry run tox                                ~~ ===
# === Запуск линтинга - poetry run tox -e lint                             ~~ ===
# === Запуск проверки типов - poetry run tox -e type                       ~~ ===
# === Запуск тестов - poetry run tox -e test                               ~~ ===
# === Запуск всех проверок - poetry run tox -e lint,type                   ~~ ===
# === Запуск mypy-проверки (main + mcp_servers) - poetry run tox -e type   ~~ ===
# === Запуск форматирование фронтенда - poetry run tox -e web              ~~ ===
# === === === === === === === === === === === === === === === === === === === ===

# ===================================================================================================================
