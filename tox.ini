[tox]
min_version = 4.12
requires = tox-uv
envlist = lint,type,test
; skipsdist = true

[testenv]
runner = uv-venv-lock-runner

[testenv:lint]
dependency_groups = lint
description = Run ruff linter
commands = ruff check .

[testenv:pyright]
description = Basedpyright type checker (IDE parity, catches mypy blind spots)
allowlist_externals = basedpyright
commands = basedpyright --project .

[testenv:type]
dependency_groups = type-check
changedir = {toxinidir}
commands =
    mypy .
    mypy --config-file mcp_servers/mypy.ini mcp_servers/__init__.py mcp_servers/mcp_stub_auth.py mcp_servers/mcp_stub_hardening.py mcp_servers/mcp_stub_runtime.py mcp_servers/mcp_stub_tools.py mcp_servers/analytics mcp_servers/gateway mcp_servers/platform mcp_servers/edms/__init__.py mcp_servers/edms/edms_mcp_server.py

[testenv:test]
dependency_groups = test
commands =
    pytest --cov=palatium_ai --cov-report=term-missing -m "not live and not llm_live and not slow"

[testenv:web]
skip_install = true
changedir = web
allowlist_externals = npm, npx
commands =
    npm install --no-save prettier eslint
    npx prettier --write .
    ; npx eslint --fix .

# =====================================================================================================================

# === === === === === === === === === === === === === === === === === ===  === ===  uv tool install tox --with tox-uv
# === Запуск всех проверок - uv run tox                                        ===  tox --version
# === Запуск линтинга - uv run tox -e lint                                     ===
# === Запуск проверки типов - uv run tox -e type                               ===
# === Запуск тестов - uv run tox -e test                                       ===
# === Запуск basedpyright (IDE parity) - uv run tox -e pyright                 ===
# === Запуск всех проверок - uv run tox -e lint,type,pyright                   ===
# === Запуск mypy-проверки (main + mcp_servers) - uv run tox -e type           ===
# === Запуск форматирование фронтенда - uv run tox -e web                      ===
# === === === === === === === === === === === === === === === === === ===  === ===  Remove-Item -Recurse -Force .\.tox

# =====================================================================================================================
